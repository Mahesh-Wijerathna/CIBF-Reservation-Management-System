spring.application.name=reservation-service

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/reservation-service-db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8083

# Stall Service Configuration
stall.service.url=http://localhost:8082

# Feign Client Configuration
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=basic

# Circuit Breaker Configuration (Resilience4j)
resilience4j.circuitbreaker.instances.stallService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.stallService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.stallService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.stallService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.stallService.failureRateThreshold=50

# Retry Configuration
resilience4j.retry.instances.stallService.maxAttempts=3
resilience4j.retry.instances.stallService.waitDuration=1s
        
